  windows:
    runs-on: windows-2025
    steps:
    - name: Checkout Self
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: true
    - name: Make Distdir
      shell: bash
      run: mkdir ~/ojamajo_gensou
    - name: Clone Chez Scheme
      shell: bash
      run: |
        git clone --filter=blob:none --branch v10.4.1 https://github.com/cisco/ChezScheme
        cd ChezScheme
        git submodule update --init --recursive
    - name: Build Chez Scheme
      # powershell with windows sdk available
      run: |
        cd ChezScheme
        build.bat ta6nt
    - name: Install Chez Scheme
      shell: bash
      run: |
        cp -r ChezScheme/ta6nt/bin ChezScheme/ta6nt/boot ~/ojamajo_gensou
    - name: Get Raylib
      shell: bash
      run: |
        cd thdawn
        curl -L -O https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_win64_msvc16.zip
        unzip -j raylib-6.2_win64_msvc16.zip raylib-6.2_win64_msvc16/lib/raylib.dll
    - name: Compile Project
      shell: bash
      run: |
        cd thdawn && PROD=1 ~/ojamajo_gensou/bin/ta6nt/scheme.exe --program build.ss
        cp -r assets licenses replays omake.txt README.txt start_x64.bat tech.txt thdawn.boot ~/ojamajo_gensou/
    - name: Bundle and Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ojamajo_gensou.zip
        path: ~/ojamajo_gensou/
