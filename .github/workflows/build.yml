name: Build

on: [push]

jobs:
  macos:
    strategy:
      matrix:
        config:
          - platform: macos-15
            machine_type: ta6osx
          - platform: macos-15-intel
            machine_type: tarm64osx
    runs-on: ${{ matrix.config.platform }}
    steps:
    - name: Checkout Self
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: true
    - name: Make Distdir
      run: mkdir ~/ojamajo_gensou
    - name: Build Chez Scheme
      run: |
        git clone --filter=blob:none --branch v10.4.1 https://github.com/cisco/ChezScheme
        cd ChezScheme
        git submodule update --init --recursive
        ./configure --disable-curses --disable-x11 --installprefix=~/ojamajo_gensou
        make
        make install
        # Delete examples and manpages
        rm -rf ~/ojamajo_gensou/lib/csv10.4.1/examples ~/ojamajo_gensou/share
    - name: Get Raylib
      run: |
        curl -L https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_macos.tar.gz | tar xzf -
        cp raylib-6.2_macos/lib/libraylib.6.2.0.dylib ~/ojamajo_gensou/libraylib.dylib
    - name: Compile Project
      run: |
        cd thdawn && PROD=1 ~/ojamajo_gensou/bin/scheme --program build.ss
        cp -r assets licenses replays omake.txt README.txt start.sh tech.txt thdawn.boot ~/ojamajo_gensou/
    - name: Bundle and Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ojamajo_gensou_${{ matrix.config.machine_type }}.zip
        path: ~/ojamajo_gensou/
  windows:
    strategy:
      matrix:
        config:
          - platform: windows-2025
            machine_type: ta6nt
            start_script: start_x64.bat
            raylib_name: raylib-6.2_win64_msvc16
          - platform: windows-11-arm
            machine_type: tarm64nt
            start_script: start_arm64.bat
            raylib_name: raylib-6.2_winarm64_msvc16
    runs-on: ${{ matrix.config.platform }}
    steps:
    - name: Checkout Self
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: true
    - name: Make Distdir
      shell: bash
      run: mkdir ~/ojamajo_gensou
    - name: Clone Chez Scheme
      shell: bash
      run: |
        git clone --filter=blob:none --branch v10.4.1 https://github.com/cisco/ChezScheme
        cd ChezScheme
        git submodule update --init --recursive
    - name: Build Chez Scheme
      # powershell with windows sdk available
      run: |
        cd ChezScheme
        .\build.bat ${{ matrix.config.machine_type }}
    - name: Install Chez Scheme
      shell: bash
      run: |
        cp -r ChezScheme/${{ matrix.config.machine_type }}/bin ChezScheme/${{ matrix.config.machine_type }}/boot ~/ojamajo_gensou
    - name: Get Raylib
      shell: bash
      run: |
        cd thdawn
        curl -L -O https://github.com/raysan5/raylib/releases/download/6.2/${{ matrix.config.raylib_name }}.zip
        unzip -j ${{ matrix.config.raylib_name }}.zip ${{ matrix.config.raylib_name }}/lib/raylib.dll -d ~/ojamajo_gensou
    - name: Compile Project
      shell: bash
      run: |
        cd thdawn && PROD=1 ~/ojamajo_gensou/bin/${{ matrix.config.machine_type }}/scheme.exe --program build.ss
        cp -r assets licenses replays omake.txt README.txt ${{ matrix.config.start_script }} tech.txt thdawn.boot ~/ojamajo_gensou/
    - name: Bundle and Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ojamajo_gensou_${{ matrix.config.machine_type }}.zip
        path: ~/ojamajo_gensou/
